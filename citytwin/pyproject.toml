[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "citytwin"
version = "0.5.0"
description = "Dakhla build of citytwin: Overture footprints to CityJSON, height completion with intervals, heat-exposure analytics, OGC API Features, 3D Tiles and an auditable agent layer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Qianyi Cao" }]
requires-python = ">=3.11"
keywords = [
  "geospatial",
  "digital-twin",
  "cityjson",
  "3d-tiles",
  "ogc-api",
  "geoai",
  "urban-heat",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyproj>=3.6",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyarrow>=16.0",
  "s3fs>=2024.6",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "httpx2>=2.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
citytwin = "citytwin.cli:main"

[project.urls]
Homepage = "https://github.com/alabbaci/adnanelabbaci.github.io/tree/main/citytwin"
Upstream = "https://github.com/caoqyqianyi/citytwin"

[tool.hatch.build.targets.wheel]
packages = ["src/citytwin"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["citytwin"]
