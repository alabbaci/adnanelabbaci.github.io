name: Africa Weather Explorer and existing site
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8,20 * * *'
  # This workflow is the only publisher of the site (Pages source: GitHub
  # Actions), so every change on main has to go through it.
  push:
    branches: [main]
  # The energy forecast commits to main with the Actions token, which does not
  # start push workflows; publish its new data when it finishes.
  workflow_run:
    workflows: ['Morocco energy forecast']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: africa-weather-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # Always publish main, whichever branch the run was started from
      # (schedules and workflow_run fire on the default branch).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: weather-source/uv.lock
      - run: uv sync --python 3.12 --frozen
        working-directory: weather-source
      - name: Install ecCodes (GRIB decoding for the forecast sweep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
        continue-on-error: true
      - name: Refresh Africa forecasts
        working-directory: weather-source
        shell: bash
        run: |
          set +e
          uv run python -m sweep --no-ai --out ../weather/data
          result=$?
          # A failed refresh must not block the rest of the site: publish the
          # last committed forecast data instead and flag it on the run.
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then
            echo "::warning::Africa forecast refresh failed (exit $result); deploying the last committed weather data."
            git checkout -- ../weather/data
          fi
      - name: Package existing site and Weather Explorer together
        run: |
          mkdir -p _public
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.claude/' --exclude='_public/' --exclude='weather-source/' --exclude='ourika/pipeline/' --exclude='toubkal/pipeline/' --exclude='.cache/' --exclude='__pycache__/' ./ _public/
          touch _public/.nojekyll
          test -f _public/index.html
          test -f _public/weather/index.html
          test -f _public/weather/data/feed.json
          test -f _public/ourika/index.html
          test -f _public/ourika/data/watershed.geojson
          test -f _public/toubkal/index.html
          test -f _public/toubkal/data/scene.json
          test -f _public/vendor/three/three-0.170.0.module.min.js
      - uses: actions/configure-pages@v5
      # One artifact name per attempt: deploy-pages refuses to choose when a
      # re-run leaves two artifacts with the same name on the run.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _public
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # The artifact listing can lag the upload by a moment, which fails the
      # deploy with "No artifacts named ... were found"; try once more.
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
