name: Africa Weather Explorer and existing site
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8,20 * * *'
  push:
    branches: [main, claude/dakhla-heat-mapping-eti6k0]
    paths:
      - 'weather/**'
      - 'weather-source/**'
      - 'ourika/**'
      - 'dakhla/**'
      - 'vendor/**'
      - '.github/workflows/africa-weather.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: africa-weather-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: weather-source/uv.lock
      - run: uv sync --python 3.12 --frozen
        working-directory: weather-source
      - name: Install ecCodes (GRIB decoding for the forecast sweep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
        continue-on-error: true
      - name: Refresh Africa forecasts
        working-directory: weather-source
        shell: bash
        run: |
          set +e
          uv run python -m sweep --no-ai --out ../weather/data
          result=$?
          # A failed refresh must not block the rest of the site: publish the
          # last committed forecast data instead and flag it on the run.
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then
            echo "::warning::Africa forecast refresh failed (exit $result); deploying the last committed weather data."
            git checkout -- ../weather/data
          fi
      - name: Package existing site and Weather Explorer together
        run: |
          mkdir -p _public
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.claude/' --exclude='_public/' --exclude='weather-source/' --exclude='ourika/pipeline/' --exclude='dakhla/pipeline/' --exclude='.cache/' --exclude='__pycache__/' ./ _public/
          touch _public/.nojekyll
          test -f _public/index.html
          test -f _public/weather/index.html
          test -f _public/weather/data/feed.json
          test -f _public/ourika/index.html
          test -f _public/ourika/data/watershed.geojson
          test -f _public/dakhla/index.html
          test -f _public/dakhla/data/sectors.geojson
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - uses: actions/deploy-pages@v4
        id: deploy
