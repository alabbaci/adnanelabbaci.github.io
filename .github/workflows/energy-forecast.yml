name: Morocco energy forecast

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC (06:17 Morocco)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energy-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: energy/requirements.txt

      - run: pip install -r energy/requirements.txt

      # Reanalysis history is immutable once a year is complete, so cache it
      # between runs to keep Open-Meteo traffic small.
      - uses: actions/cache@v4
        with:
          path: energy/.cache
          key: weather-${{ github.run_id }}
          restore-keys: weather-

      - run: python energy/pipeline/run_daily.py

      - name: Commit forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energy/data/forecast.json energy/data/analytics.json
          git diff --cached --quiet && exit 0
          git commit -m "energy: daily forecast $(date -u +%F)"
          git push
