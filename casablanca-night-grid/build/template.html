<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casablanca // night grid</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0714; }
  canvas { display:block; }
  #panel {
    position:fixed; top:16px; left:16px; z-index:10;
    background:rgba(16,12,26,.85); border:1px solid #2e2440; border-radius:12px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:14px 16px; width:250px;
    font:13px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#efe9e0;
  }
  #panel h1 { font-size:14px; margin:0 0 2px; font-weight:600; letter-spacing:.4px; }
  #panel .sub { font-size:11px; margin:0 0 8px; }
  #panel .muted { color:#a196ad; }
  #counts { margin:0 0 10px; }
  #legend {
    height:10px; border-radius:5px; margin:4px 0 2px;
    background:linear-gradient(90deg,#2b1d4e,#8f4f6d 45%,#e8a24a 75%,#fff3d6);
  }
  #legendlbl { display:flex; justify-content:space-between; font-size:11px; color:#a196ad; margin-bottom:10px; }
  label.opt { display:flex; align-items:center; gap:8px; margin:6px 0; cursor:pointer; user-select:none; }
  label.opt input { accent-color:#e8a24a; width:14px; height:14px; cursor:pointer; }
  #hint { margin-top:10px; font-size:11px; color:#a196ad; }
  #attrib { margin-top:8px; font-size:10px; color:#6f6580; }
  #attrib a { color:#a196ad; }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0a0714; color:#a196ad; z-index:20;
    font:13px "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
</style>
</head>
<body>
<div id="loading">building geometry &hellip;</div>
<div id="panel">
  <h1>Casablanca // night grid</h1>
  <div class="sub muted">old medina &middot; downtown &middot; Hassan II Mosque</div>
  <div id="counts" class="muted"></div>
  <div id="legend"></div>
  <div id="legendlbl"><span>4 m</span><span>height (log)</span><span>200 m+</span></div>
  <label class="opt"><input type="checkbox" id="ckBloom" checked> Bloom glow</label>
  <label class="opt"><input type="checkbox" id="ckScan" checked> Floor scanlines</label>
  <label class="opt"><input type="checkbox" id="ckPulse" checked> City pulse</label>
  <div id="hint">drag rotate &middot; right-drag pan &middot; scroll zoom</div>
  <div id="attrib">data &copy; <a href="https://overturemaps.org/">Overture Maps</a> /
    <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div>
</div>

<!--LIBS-->

<script>
/*PAYLOAD*/
</script>

<script>
(function () {
"use strict";

// surface any startup error on the loading overlay instead of hanging silently
window.onerror = function (msg, src, line, col) {
  var el = document.getElementById("loading");
  if (el) el.textContent = "startup error: " + msg + "  [line " + line + ":" + col + "]";
};

// ---------- decode base64 -> typed arrays ----------
function bytes(b64) {
  const s = atob(b64), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
const bLens    = new Uint16Array(bytes(P.bLens).buffer);
const bRoles   = new Uint8Array(bytes(P.bRoles).buffer);
const bStarts  = new Int32Array(bytes(P.bStarts).buffer);
const bDeltas  = new Int16Array(bytes(P.bDeltas).buffer);
const bRings   = new Uint8Array(bytes(P.bRings).buffer);
const bHeights = new Float32Array(bytes(P.bHeights).buffer);
const rLens    = new Uint16Array(bytes(P.rLens).buffer);
const rStarts  = new Int32Array(bytes(P.rStarts).buffer);
const rDeltas  = new Int16Array(bytes(P.rDeltas).buffer);
const SCALE = P.meta.scale;

// ---------- reconstruct absolute quantized ring coords ----------
function reconstruct(lens, starts, deltas) {
  let total = 0;
  for (let i = 0; i < lens.length; i++) total += lens[i];
  const xy = new Int32Array(total * 2);
  const off = new Uint32Array(lens.length + 1);
  let v = 0, d = 0;
  for (let r = 0; r < lens.length; r++) {
    off[r] = v;
    let x = starts[2 * r], y = starts[2 * r + 1];
    xy[2 * v] = x; xy[2 * v + 1] = y; v++;
    for (let k = 1; k < lens[r]; k++) {
      x += deltas[d++]; y += deltas[d++];
      xy[2 * v] = x; xy[2 * v + 1] = y; v++;
    }
  }
  off[lens.length] = v;
  return { xy, off };
}
const B = reconstruct(bLens, bStarts, bDeltas);
const R = reconstruct(rLens, rStarts, rDeltas);

// ---------- center on buildings' bbox midpoint ----------
let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
for (let i = 0; i < B.xy.length; i += 2) {
  const x = B.xy[i], y = B.xy[i + 1];
  if (x < minX) minX = x; if (x > maxX) maxX = x;
  if (y < minY) minY = y; if (y > maxY) maxY = y;
}
const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
const wx = i => (B.xy[2 * i]     - cx) / SCALE;          // world X (buildings)
const wz = i => -(B.xy[2 * i + 1] - cy) / SCALE;         // world Z = -y

// ---------- height -> color ramp (log scale) ----------
// "the white city" at night: deep indigo -> mulberry -> gold -> warm white
const STOPS = [
  [0.00, 0x2b, 0x1d, 0x4e],
  [0.45, 0x8f, 0x4f, 0x6d],
  [0.75, 0xe8, 0xa2, 0x4a],
  [1.00, 0xff, 0xf3, 0xd6],
];
function rampColor(h) {
  const t = Math.min(1, Math.max(0, Math.log(Math.max(h, 4) / 4) / Math.log(200 / 4)));
  let i = 0;
  while (i < STOPS.length - 2 && t > STOPS[i + 1][0]) i++;
  const a = STOPS[i], b = STOPS[i + 1];
  const f = (t - a[0]) / (b[0] - a[0]);
  return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
}

// ---------- build merged building geometry ----------
// sun direction in source plan, normalized
const SL = Math.hypot(-0.55, 0.75), SX = -0.55 / SL, SY = 0.75 / SL;

// pass 1: count wall vertices + run earcut per polygon to count roof vertices
let wallV = 0;
for (let r = 0; r < bLens.length; r++) wallV += bLens[r] * 6;

const polyTris = [];   // { tris, verts:[worldX,worldZ,...], bld }
let roofV = 0;
{
  let ring = 0;
  for (let b = 0; b < P.meta.nBld; b++) {
    const nr = bRings[b];
    let g = ring;
    while (g < ring + nr) {
      // polygon = outer ring at g + following holes
      let end = g + 1;
      while (end < ring + nr && bRoles[end] === 1) end++;
      const flat = [], holes = [];
      for (let rr = g; rr < end; rr++) {
        if (rr > g) holes.push(flat.length / 2);
        for (let v = B.off[rr]; v < B.off[rr + 1]; v++) flat.push(wx(v), wz(v));
      }
      const tris = earcut(flat, holes.length ? holes : null);
      roofV += tris.length;
      polyTris.push({ tris, flat, bld: b });
      g = end;
    }
    ring += nr;
  }
}

const totalV = wallV + roofV;
const pos = new Float32Array(totalV * 3);
const col = new Uint8Array(totalV * 3);
const nrm = new Int8Array(totalV * 3);
let p = 0; // vertex cursor

function push(x, y, z, r, g, b, nx, ny, nz) {
  pos[3 * p] = x; pos[3 * p + 1] = y; pos[3 * p + 2] = z;
  col[3 * p] = r; col[3 * p + 1] = g; col[3 * p + 2] = b;
  nrm[3 * p] = nx; nrm[3 * p + 1] = ny; nrm[3 * p + 2] = nz;
  p++;
}

// walls
{
  let ring = 0;
  for (let b = 0; b < P.meta.nBld; b++) {
    const nr = bRings[b];
    let h = bHeights[b]; if (!(h > 0.5)) h = 4.5;
    const base = rampColor(h);
    for (let rr = ring; rr < ring + nr; rr++) {
      const s = B.off[rr], e = B.off[rr + 1], n = e - s;
      for (let k = 0; k < n; k++) {
        const i0 = s + k, i1 = s + ((k + 1) % n);
        // source-plan edge normal (CCW exterior / CW holes -> outward)
        const dx = B.xy[2 * i1] - B.xy[2 * i0], dy = B.xy[2 * i1 + 1] - B.xy[2 * i0 + 1];
        const len = Math.hypot(dx, dy); if (len === 0) continue;
        const nx2 = dy / len, ny2 = -dx / len;
        const lam = 0.42 + 0.58 * Math.max(0, nx2 * SX + ny2 * SY);
        const r8 = Math.min(255, base[0] * lam) | 0,
              g8 = Math.min(255, base[1] * lam) | 0,
              b8 = Math.min(255, base[2] * lam) | 0;
        const NX = (nx2 * 127) | 0, NZ = (-ny2 * 127) | 0;
        const ax = wx(i0), az = wz(i0), bx = wx(i1), bz = wz(i1);
        push(ax, 0, az, r8, g8, b8, NX, 0, NZ);
        push(bx, 0, bz, r8, g8, b8, NX, 0, NZ);
        push(bx, h, bz, r8, g8, b8, NX, 0, NZ);
        push(ax, 0, az, r8, g8, b8, NX, 0, NZ);
        push(bx, h, bz, r8, g8, b8, NX, 0, NZ);
        push(ax, h, az, r8, g8, b8, NX, 0, NZ);
      }
    }
    ring += nr;
  }
}

// roofs (wound to face up)
for (const pt of polyTris) {
  let h = bHeights[pt.bld]; if (!(h > 0.5)) h = 4.5;
  const base = rampColor(h);
  const r8 = Math.min(255, base[0] * 1.15) | 0,
        g8 = Math.min(255, base[1] * 1.15) | 0,
        b8 = Math.min(255, base[2] * 1.15) | 0;
  const f = pt.flat, T = pt.tris;
  for (let t = 0; t < T.length; t += 3) {
    let a = T[t], b = T[t + 1], c = T[t + 2];
    const ux = f[2 * b] - f[2 * a], uz = f[2 * b + 1] - f[2 * a + 1];
    const vx = f[2 * c] - f[2 * a], vz = f[2 * c + 1] - f[2 * a + 1];
    if (uz * vx - ux * vz < 0) { const tmp = b; b = c; c = tmp; } // ny = u.z*v.x - u.x*v.z
    push(f[2 * a], h, f[2 * a + 1], r8, g8, b8, 0, 127, 0);
    push(f[2 * b], h, f[2 * b + 1], r8, g8, b8, 0, 127, 0);
    push(f[2 * c], h, f[2 * c + 1], r8, g8, b8, 0, 127, 0);
  }
}

// ---------- roads -> LineSegments positions ----------
let segV = 0;
for (let r = 0; r < rLens.length; r++) segV += (rLens[r] - 1) * 2;
const rpos = new Float32Array(segV * 3);
{
  let q = 0;
  for (let r = 0; r < rLens.length; r++) {
    for (let v = R.off[r]; v < R.off[r + 1] - 1; v++) {
      rpos[q++] = (R.xy[2 * v] - cx) / SCALE;       rpos[q++] = 0.6; rpos[q++] = -(R.xy[2 * v + 1] - cy) / SCALE;
      rpos[q++] = (R.xy[2 * v + 2] - cx) / SCALE;   rpos[q++] = 0.6; rpos[q++] = -(R.xy[2 * v + 3] - cy) / SCALE;
    }
  }
}

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0714, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0714, 7000, 17000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 2, 60000);
camera.position.set(2400, 1900, 3100);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 60;
controls.maxDistance = 15000;

const uniforms = {
  uTime:  { value: 0 },
  uScan:  { value: 1 },
  uPulse: { value: 1 },
  uCam:   { value: new THREE.Vector3() },
};

// buildings
const bGeo = new THREE.BufferGeometry();
bGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
bGeo.setAttribute("color",    new THREE.BufferAttribute(col, 3, true));
bGeo.setAttribute("normal",   new THREE.BufferAttribute(nrm, 3, true));
bGeo.computeBoundingSphere();

const bMat = new THREE.ShaderMaterial({
  uniforms,
  vertexColors: true,
  transparent: true,
  depthWrite: true,
  vertexShader: `
    varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main() {
      vC = color; vN = normal;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime, uScan, uPulse; uniform vec3 uCam;
    varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main() {
      vec3 N = normalize(vN);
      vec3 col = vC;
      // floor scanlines (walls only) — warm lamplight bands
      float wall = step(abs(N.y), 0.6);
      float fl = fract(vW.y / 3.0);
      float band = smoothstep(0.55, 0.35, fl) * smoothstep(0.05, 0.25, fl);
      col += uScan * wall * band * vec3(0.30, 0.20, 0.08);
      // fresnel rim — gold
      float fr = pow(1.0 - abs(dot(N, normalize(uCam - vW))), 2.6);
      col += fr * vec3(0.72, 0.48, 0.18) * 0.9;
      // city pulse
      float d = length(vW.xz);
      float ph = mod(d - uTime * 220.0, 2800.0);
      float w = exp(-abs(ph - 200.0) / 110.0);
      col += uPulse * w * mix(vec3(0.65, 0.40, 0.12), vec3(0.55, 0.10, 0.25), 0.5 + 0.5 * sin(uTime * 0.7)) * 0.5;
      // fog
      float dc = length(uCam - vW);
      float f = clamp((dc - 7000.0) / 10000.0, 0.0, 1.0);
      col = mix(col, vec3(0.0392, 0.0275, 0.0784), f);
      gl_FragColor = vec4(col, 0.93);
    }`,
});
scene.add(new THREE.Mesh(bGeo, bMat));

// roads — cool teal against the warm building ramp
const rGeo = new THREE.BufferGeometry();
rGeo.setAttribute("position", new THREE.BufferAttribute(rpos, 3));
rGeo.computeBoundingSphere();
const rMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vW;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime, uPulse; uniform vec3 uCam;
    varying vec3 vW;
    void main() {
      float d = length(vW.xz);
      float ph = mod(d - uTime * 220.0, 2800.0);
      float w = exp(-abs(ph - 200.0) / 110.0);
      vec3 col = vec3(0.16, 0.86, 0.80) * (0.55 + uPulse * 0.85 * w);
      float dc = length(uCam - vW);
      float f = clamp((dc - 7000.0) / 10000.0, 0.0, 1.0);
      gl_FragColor = vec4(col * (1.0 - f), 0.85);
    }`,
});
scene.add(new THREE.LineSegments(rGeo, rMat));

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60000, 60000),
  new THREE.MeshBasicMaterial({ color: 0x100c18 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.6;
scene.add(ground);

// ---------- post-processing ----------
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
composer.addPass(new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.45, 0.55));
composer.setSize(window.innerWidth, window.innerHeight);

// ---------- UI ----------
const fmt = n => n.toLocaleString("en-US");
document.getElementById("counts").textContent =
  fmt(P.meta.nBld) + " buildings · " + fmt(segV / 2) + " road segments";
let bloomOn = true;
document.getElementById("ckBloom").addEventListener("change", e => { bloomOn = e.target.checked; });
document.getElementById("ckScan").addEventListener("change", e => { uniforms.uScan.value = e.target.checked ? 1 : 0; });
document.getElementById("ckPulse").addEventListener("change", e => { uniforms.uPulse.value = e.target.checked ? 1 : 0; });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  uniforms.uTime.value = clock.getElapsedTime();
  uniforms.uCam.value.copy(camera.position);
  if (bloomOn) composer.render(); else renderer.render(scene, camera);
}
document.getElementById("loading").remove();
animate();
})();
</script>
</body>
</html>
