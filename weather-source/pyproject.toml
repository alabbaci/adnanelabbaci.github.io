[project]
name = "africa-weather-explorer"
version = "0.1.0"
description = "Sweeps ECMWF Open Data twice a day for notable weather over Africa and publishes animated scenes as a static site"
requires-python = ">=3.11,<3.14"
dependencies = [
    "eccodes>=2.38",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
